
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VECTRIX: Operational Warfare - Treino 3D</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: Arial, sans-serif;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #game-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    
    /* Crosshair / Mira */
    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }
    .crosshair::before, .crosshair::after {
      content: '';
      position: absolute;
      background: #00ff66;
    }
    .crosshair::before { top: 4px; left: -5px; width: 20px; height: 2px; }
    .crosshair::after { top: -5px; left: 4px; width: 2px; height: 20px; }

    /* HUD */
    .hud-top {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #00ff66;
      font-weight: bold;
      font-size: 14px;
      z-index: 10;
      background: rgba(0,0,0,0.6);
      padding: 10px 15px;
      border-radius: 6px;
      border: 1px solid #00ff66;
    }
    .btn-back {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 10;
      background: rgba(255, 50, 50, 0.8);
      color: white;
      border: none;
      padding: 10px 15px;
      font-weight: bold;
      border-radius: 6px;
      text-decoration: none;
    }

    /* Controlos Mobile Touch */
    #btn-shoot {
      position: absolute;
      bottom: 30px;
      right: 30px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(255, 50, 50, 0.6);
      border: 3px solid #ff3333;
      color: white;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      font-size: 14px;
    }
    #btn-shoot:active {
      background: rgba(255, 0, 0, 0.9);
    }
  </style>

  <!-- Library Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="game-container"></div>
  <div class="crosshair"></div>

  <div class="hud-top">
    VECTRIX 3D - MODO TREINO<br>
    Alvos Atingidos: <span id="score">0</span>
  </div>

  <a href="index.html" class="btn-back">SAIR</a>
  <div id="btn-shoot">ATIRAR</div>

  <script>
    let scene, camera, renderer;
    let targets = [];
    let score = 0;

    function init() {
      const container = document.getElementById('game-container');

      // 1. Cena
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x101520);
      scene.fog = new THREE.FogExp2(0x101520, 0.02);

      // 2. Câmara
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.6, 0);

      // 3. Luzes
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xff7700, 0.8);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      // 4. Chão
      const floorGeo = new THREE.PlaneGeometry(80, 80);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x1f242d, roughness: 0.8 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // 5. Obstáculos / Caixas
      createObstacle(-4, 1.5, -8, 2, 3, 2, 0x3a4454);
      createObstacle(5, 1.5, -12, 4, 3, 1, 0x3a4454);
      createObstacle(0, 1.5, -16, 6, 3, 1, 0xff7700);

      // 6. Criar Alvos Iniciais
      spawnTarget(-4, 1.5, -8);
      spawnTarget(5, 2, -12);
      spawnTarget(0, 2.5, -16);
      spawnTarget(-2, 1.5, -12);
      spawnTarget(3, 1.5, -6);

      // 7. Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      setupControls();
      animate();
    }

    function createObstacle(x, y, z, w, h, d, color) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color: color });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      scene.add(mesh);
    }

    function spawnTarget(x, y, z) {
      const geo = new THREE.CylinderGeometry(0.4, 0.4, 1.8, 16);
      const mat = new THREE.MeshStandardMaterial({ color: 0xff3333, roughness: 0.3 });
      const target = new THREE.Mesh(geo, mat);
      target.position.set(x, y, z);
      scene.add(target);
      targets.push(target);
    }

    function setupControls() {
      // Controlo com Rato no PC
      let isPointerLocked = false;
      document.body.addEventListener('click', (e) => {
        if(e.target.id !== 'btn-shoot' && e.target.className !== 'btn-back') {
          document.body.requestPointerLock();
        }
      });

      document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === document.body) {
          camera.rotation.y -= e.movementX * 0.002;
          camera.rotation.x -= e.movementY * 0.002;
          camera.rotation.x = Math.max(-Math.PI/3, Math.min(Math.PI/3, camera.rotation.x));
        }
      });

      document.addEventListener('mousedown', (e) => {
        if (document.pointerLockElement === document.body && e.button === 0) {
          shoot();
        }
      });

      // Controlo Touch no Telemóvel
      let touchStartX, touchStartY;
      window.addEventListener('touchstart', (e) => {
        for (let t of e.touches) {
          if (t.clientX > window.innerWidth / 3 && t.target.id !== 'btn-shoot') {
            touchStartX = t.clientX;
            touchStartY = t.clientY;
          }
        }
      });

      window.addEventListener('touchmove', (e) => {
        for (let t of e.touches) {
          if (touchStartX !== undefined && t.target.id !== 'btn-shoot') {
            let deltaX = t.clientX - touchStartX;
            let deltaY = t.clientY - touchStartY;

            camera.rotation.y -= deltaX * 0.004;
            camera.rotation.x -= deltaY * 0.004;
            camera.rotation.x = Math.max(-Math.PI/3, Math.min(Math.PI/3, camera.rotation.x));

            touchStartX = t.clientX;
            touchStartY = t.clientY;
          }
        }
      });

      const btnShoot = document.getElementById('btn-shoot');
      btnShoot.addEventListener('touchstart', (e) => {
        e.preventDefault();
        shoot();
      });
    }

    function shoot() {
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

      const intersects = raycaster.intersectObjects(targets);
      if (intersects.length > 0) {
        const hitTarget = intersects[0].object;
        scene.remove(hitTarget);
        targets = targets.filter(t => t !== hitTarget);
        score += 1;
        document.getElementById('score').innerText = score;

        // Respawn automático do alvo
        setTimeout(() => {
          let rx = (Math.random() - 0.5) * 16;
          let rz = -6 - Math.random() * 12;
          spawnTarget(rx, 1.5, rz);
        }, 800);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
  </script>
</body>
</html>
